<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tank Battle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
            font-family: 'Courier New', monospace;
        }
        #gameContainer {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #16213e;
            border-bottom: 2px solid #e94560;
            flex-shrink: 0;
        }
        #header h1 {
            color: #e94560;
            font-size: 20px;
        }
        #controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        #controls label {
            color: #fff;
            font-size: 14px;
        }
        #tankCount {
            width: 120px;
            padding: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #fff;
            border: 2px solid #e94560;
            border-radius: 4px;
            text-align: left;
        }
        #predatorPercent,
        #missilePercent,
        #healthPoints {
            width: 90px;
            padding: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #fff;
            border: 2px solid #e94560;
            border-radius: 4px;
            text-align: left;
        }
        #gameMode {
            width: 140px;
            padding: 8px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: #1a1a2e;
            color: #fff;
            border: 2px solid #e94560;
            border-radius: 4px;
            text-align: left;
        }
        #tankCount:focus {
            outline: none;
            border-color: #ff6b6b;
        }
        #predatorPercent:focus,
        #missilePercent:focus,
        #healthPoints:focus {
            outline: none;
            border-color: #ff6b6b;
        }
        #gameMode:focus {
            outline: none;
            border-color: #ff6b6b;
        }
        button {
            padding: 8px 16px;
            font-size: 14px;
            font-family: 'Courier New', monospace;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #ff6b6b;
        }
        #canvasWrapper {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #gameCanvas {
            display: block;
        }
        #footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: #16213e;
            border-top: 2px solid #e94560;
            flex-shrink: 0;
            max-height: 120px;
            overflow: hidden;
        }
        #ui {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
            overflow-y: auto;
            max-height: 100px;
            flex: 1;
        }
        .tank-status {
            padding: 4px 8px;
            border-radius: 4px;
            color: white;
            font-size: 10px;
            font-weight: bold;
            text-shadow: 1px 1px 2px black;
            white-space: nowrap;
        }
        .tank-status.compact {
            padding: 3px 6px;
            font-size: 9px;
        }
        #winner {
            font-size: 18px;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8);
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="header">
            <h1>AI TANK BATTLE</h1>
            <div id="controls">
                <label for="tankCount">Tanks:</label>
                <input type="text" id="tankCount" value="6">
                <label for="gameMode">Mode:</label>
                <select id="gameMode">
                    <option value="random">Random</option>
                    <option value="teams">Red / Blue</option>
                </select>
                <label for="predatorPercent">Predators %:</label>
                <input type="text" id="predatorPercent" placeholder="15">
                <label for="missilePercent">Rockets %:</label>
                <input type="text" id="missilePercent" placeholder="15">
                <label for="healthPoints">Health:</label>
                <input type="text" id="healthPoints" placeholder="100">
                <button onclick="restartGame()">NEW BATTLE</button>
                <button onclick="togglePause()">PAUSE</button>
            </div>
        </div>
        <div id="canvasWrapper">
            <canvas id="gameCanvas"></canvas>
        </div>
        <div id="footer">
            <div id="ui"></div>
            <div id="winner"></div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
